name: Navigation Smoke Test

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Manager workflow run containing the manager APK
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  navigation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Download tested manager APK
        uses: actions/download-artifact@v7
        with:
          name: manager
          path: smoke-apk
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise tabs in gesture and three-button navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r $(find smoke-apk -name '*.apk' | head -n 1)
            python3 scripts/navigation-smoke.py --output navigation-smoke
      - name: Upload screenshots and UI trees
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: navigation-smoke
          path: navigation-smoke/
          if-no-files-found: warn
