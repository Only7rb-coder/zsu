name: Announce published release to Telegram

on:
  release:
    types: [published]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose a safe setup or test action"
        required: true
        default: discover_chat
        type: choice
        options:
          - discover_chat
          - send_test
          - announce_latest
          - send_group_test

permissions:
  contents: write

concurrency:
  group: telegram-release-announcement
  cancel-in-progress: false

jobs:
  discover-chat:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'discover_chat' }}
    runs-on: ubuntu-latest
    steps:
      - name: Read the latest Telegram group update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || {
            echo "TELEGRAM_BOT_TOKEN repository secret is required."
            exit 1
          }
          response="$(curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?allowed_updates=%5B%22message%22%5D")"
          chat_id="$(printf '%s' "$response" | jq -r '
            .result[]
            | select(.message.chat.type == "group" or .message.chat.type == "supergroup")
            | .message.chat.id
          ' | tail -n 1)"
          test -n "$chat_id" && test "$chat_id" != "null" || {
            echo "No group message was found. Send /start to the bot in the target group and run this action again."
            exit 1
          }
          echo "::notice title=Telegram group chat ID::$chat_id"

  announce-release:
    if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'send_test' || inputs.mode == 'announce_latest' || inputs.mode == 'send_group_test')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Send the release announcement
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN repository secret is required."; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "TELEGRAM_CHAT_ID repository secret is required."; exit 1; }
          event_name="${{ github.event_name }}"
          mode="${{ inputs.mode }}"
          if [ "$event_name" = "workflow_dispatch" ] && [ "$mode" = "send_test" ]; then
            message="ZSU release announcements are connected. Future published ZSU releases will be posted here automatically."
            release_id=""
            release_body=""
            release_json=""
            should_mark="false"
          else
            if [ "$event_name" = "release" ]; then
              release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
            else
              release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
            fi
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_title="$(printf '%s' "$release_json" | jq -r '.name // .tag_name')"
            release_url="$(printf '%s' "$release_json" | jq -r '.html_url')"
            release_body="$(printf '%s' "$release_json" | jq -r '.body // ""')"
            if printf '%s' "$release_body" | grep -Fq '<!-- zsu-telegram-announced -->' && [ "$mode" != "send_group_test" ]; then
              echo "Latest release was already announced."
              exit 0
            fi
            should_mark="true"
            if [ "$mode" = "send_group_test" ]; then
              should_mark="false"
            fi
          fi
          if [ -n "$release_id" ]; then
            work_dir="$(mktemp -d)"
            trap 'rm -rf "$work_dir"' EXIT
            normal_asset="$(printf '%s' "$release_json" | jq -c '[.assets[] | select(.name | endswith(".apk") and (contains("spoofed") | not))][0]')"
            spoofed_asset="$(printf '%s' "$release_json" | jq -c '[.assets[] | select(.name | endswith(".apk") and contains("spoofed"))][0]')"
            test "$normal_asset" != "null" && test "$spoofed_asset" != "null" || {
              echo "Expected normal and spoofed APK assets."
              exit 1
            }
            normal_name="$(printf '%s' "$normal_asset" | jq -r '.name')"
            normal_url="$(printf '%s' "$normal_asset" | jq -r '.browser_download_url')"
            spoofed_name="$(printf '%s' "$spoofed_asset" | jq -r '.name')"
            spoofed_url="$(printf '%s' "$spoofed_asset" | jq -r '.browser_download_url')"
            normal_path="$work_dir/$normal_name"
            spoofed_path="$work_dir/$spoofed_name"
            curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              --location --output "$normal_path" "$normal_url"
            curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              --location --output "$spoofed_path" "$spoofed_url"
            changes="$(printf '%s' "$release_body" | sed '/<!-- zsu-telegram-announced -->/d' | tr -d '\r')"
            changes="${changes:0:700}"
            caption="${release_title}\n\nChanges:\n${changes:-See the release page for details.}\n\nDownload: ${release_url}"
            media="$(jq -nc --arg caption "$caption" '[
              {type: "document", media: "attach://normal", caption: $caption},
              {type: "document", media: "attach://spoofed"}
            ]')"
            curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              --form-string "media=${media}" \
              --form "normal=@${normal_path}" \
              --form "spoofed=@${spoofed_path}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup"
          else
            curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${message}" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          fi
          if [ -n "$release_id" ] && [ "$should_mark" = "true" ]; then
            marked_body="${release_body%$'\n'}"$'\n\n<!-- zsu-telegram-announced -->'
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f body="$marked_body" >/dev/null
          fi
