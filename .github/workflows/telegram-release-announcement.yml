name: Announce published release to Telegram

on:
  release:
    types: [published]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose a safe setup or test action"
        required: true
        default: discover_chat
        type: choice
        options:
          - discover_chat
          - send_test
          - announce_latest

permissions:
  contents: write

concurrency:
  group: telegram-release-announcement
  cancel-in-progress: false

jobs:
  discover-chat:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'discover_chat' }}
    runs-on: ubuntu-latest
    steps:
      - name: Read the latest Telegram group update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || {
            echo "TELEGRAM_BOT_TOKEN repository secret is required."
            exit 1
          }
          response="$(curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?allowed_updates=%5B%22message%22%5D")"
          chat_id="$(printf '%s' "$response" | jq -r '
            .result[]
            | select(.message.chat.type == "group" or .message.chat.type == "supergroup")
            | .message.chat.id
          ' | tail -n 1)"
          test -n "$chat_id" && test "$chat_id" != "null" || {
            echo "No group message was found. Send /start to the bot in the target group and run this action again."
            exit 1
          }
          echo "::notice title=Telegram group chat ID::$chat_id"

  announce-release:
    if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'send_test' || inputs.mode == 'announce_latest')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Send the release announcement
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN repository secret is required."; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "TELEGRAM_CHAT_ID repository secret is required."; exit 1; }
          event_name="${{ github.event_name }}"
          mode="${{ inputs.mode }}"
          if [ "$event_name" = "workflow_dispatch" ] && [ "$mode" = "send_test" ]; then
            message="ZSU release announcements are connected. Future published ZSU releases will be posted here automatically."
            release_id=""
            release_body=""
            release_json=""
          else
            if [ "$event_name" = "release" ]; then
              release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
            else
              release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
            fi
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_title="$(printf '%s' "$release_json" | jq -r '.name // .tag_name')"
            release_url="$(printf '%s' "$release_json" | jq -r '.html_url')"
            release_body="$(printf '%s' "$release_json" | jq -r '.body // ""')"
            if printf '%s' "$release_body" | grep -Fq '<!-- zsu-telegram-announced -->'; then
              echo "Latest release was already announced."
              exit 0
            fi
            message="${release_title} is now available.\n\nRelease: ${release_url}\n\nOpen the release to download the normal or spoofed APK."
          fi
          if [ -n "$release_id" ]; then
            work_dir="$(mktemp -d)"
            trap 'rm -rf "$work_dir"' EXIT
            apk_count=0
            while IFS= read -r asset; do
              asset_name="$(printf '%s' "$asset" | jq -r '.name')"
              asset_url="$(printf '%s' "$asset" | jq -r '.browser_download_url')"
              asset_path="$work_dir/$asset_name"
              curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
                --location --output "$asset_path" "$asset_url"
              if printf '%s' "$asset_name" | grep -Fq 'spoofed'; then
                variant_label="Spoofed APK"
              else
                variant_label="Normal APK"
              fi
              curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
                --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
                --form "document=@${asset_path}" \
                --form-string "caption=${release_title} — ${variant_label}\nRelease: ${release_url}" \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
              apk_count=$((apk_count + 1))
            done < <(printf '%s' "$release_json" | jq -c '.assets[] | select(.name | endswith(".apk"))')
            test "$apk_count" -ge 2 || { echo "Expected at least two APK assets; found $apk_count."; exit 1; }
            message="${release_title} is now available.\n\nBoth APK files are attached above.\n\nRelease download: ${release_url}"
          fi
          curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          if [ -n "$release_id" ]; then
            marked_body="${release_body%$'\n'}"$'\n\n<!-- zsu-telegram-announced -->'
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f body="$marked_body" >/dev/null
          fi
